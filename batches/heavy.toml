# Not run by default.  Every computation of the notes that takes from about a quarter of an hour
# to several hours, and the two audits of notes 28 and 29 with the leakage audit's shuffled-label reruns:
# the enumerations over F_49 and at q = 41 and 43, the full Prym runs, the long CM sweeps, the delta and
# coset runs at q = 41 and 43, the long Jacobian runs, the inverting runs of note 21 and the elliptic K3
# runs of note 22.  The wall times the notes record add up to about 19 hours; with two tasks at a time
# and up to 8 processes each, the one run on record took 12 h 22 min.
#
# Before running it, check `free -h` and lower --memory-budget below the memory available; the scheduler
# refuses to start a budget above what is available unless given --overcommit.  A run can be stopped at any
# time (Ctrl-C) and continued later: tasks with a record are not computed again.  For one family only:
#   python3 -m taskbatch run batches/heavy.toml --out results/heavy   (all of it), or copy the [[tasks]]
#   table you need into a batch of your own.

name = "heavy"

[scheduler]
workers = 2
memory_budget_mb = 16000

[limits]
time_seconds = 3600
memory_mb = 4000

[[limits.tier]]
min_cost = 1200
time_seconds = 10800

[[limits.tier]]
min_cost = 3000
time_seconds = 21600

[[limits.tier]]
min_cost = 7200
time_seconds = 43200

# the audits of notes 28 and 29, also in audits.toml
[[tasks]]
kind = "computation"
ids = ["n28/features", "n28/audit", "n29/features", "n29/audit", "n29/features-q43", "n29/audit-q43"]
procs = 8
limits = { time_seconds = 1800, memory_mb = 6000 }

# the CM method at high precision: memory grows with the number of digits
[[tasks]]
kind = "computation"
ids = ["n20/sweep", "n20/sweep-rerun", "n26/cosets-*", "n29/cosets-4*", "n29/cosets-37-*"]
tags = ["heavy"]
procs = 6
limits = { memory_mb = 8000 }

# the two elliptic K3 runs of note 22 with the most points: a worker takes about 900 MB, and with 8 workers
# the 6000 MB of the table below were not enough (both ended at their first run on the kernel's kill)
[[tasks]]
kind = "computation"
ids = ["n22/e8a2-p5", "n22/e8a2-p7"]
tags = ["heavy"]
procs = 8
limits = { time_seconds = 7200, memory_mb = 10000 }

[[tasks]]
kind = "computation"
tags = ["heavy"]
procs = 8
limits = { memory_mb = 6000 }
