# A negative control: three tasks whose predicted values are wrong on purpose.  Each must end
# `mismatch`, and `run` must end with status 1.  If one of them ends `ok`, the comparison of a rerun
# with what is predicted of it is broken.  The ids end in "!control"; no claim refers to them.
#
# The ledger is predicted to differ from its stored log (it is identical, byte for byte); the self-test
# of the CM method likewise; and the check of the fourfold over F_17 is predicted to print 19 pairs
# "equal" (it prints 18).  Needs the stored results (DATA.md) and numpy and cypari2, as the smoke batch.

name = "negative-control"

[scheduler]
workers = 3
memory_budget_mb = 3000

[limits]
time_seconds = 120
memory_mb = 1000

[[tasks]]
kind = "computation"
ids = ["n27/ledger"]
control = { predicted = { "sixlines_ledger.log" = "differs" } }

[[tasks]]
kind = "computation"
ids = ["n20/selftest"]
control = { predicted = { "sixlines_cmmethod_selftest.log" = "differs" } }

[[tasks]]
kind = "computation"
ids = ["n14/prym-check-17"]
control = { predicted = { 'lines /^\s*pair .*\bequal$/' = 19 } }
