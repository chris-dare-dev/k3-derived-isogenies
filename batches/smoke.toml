# The three checks of the README's "Reproducing" section, and a few more that take seconds: the ledger
# rerun (byte for byte against the stored log), the theta-constant self-test of the CM method, the
# fourfold of one surface over F_17, the self-tests of the enumeration scripts, and the reruns of note 29's
# small steps against their stored logs.  About half a minute on one core; needs the stored results
# (DATA.md) and numpy and cypari2.

name = "smoke"

[scheduler]
workers = 4
memory_budget_mb = 4000

[limits]
time_seconds = 120
memory_mb = 1000

[[tasks]]
kind = "computation"
ids = ["n27/ledger", "n20/selftest", "n14/prym-check-17"]

[[tasks]]
kind = "computation"
ids = [
    "n02/selftest", "n03/fq-selftest", "n04/forms-selftest", "n05/nonsplit-selftest", "n21/forms-fp-selftest",
    "n08/levels", "n29/labelcheck", "n29/selfcheck", "n29/holdout43", "n25/review2-stored", "n25/review2-levels",
]
