# The registry of claims: every row of the claim tables of CLAIMS.md.
#
# tools/claims.py writes the tables of CLAIMS.md, the file claims/RECORDS.md and the "Main results" table
# of GUIDE.md from this file, from the batch files (which tasks exist) and from the records in records/.
# `make check` fails if the committed tables differ from what it writes.
#
# A table has a heading of CLAIMS.md and its columns.  A claim has an id, its table and the cells of its
# row in the order of the columns (Markdown, as printed).  The cells of the table `main` are the rows of
# the guide's "Main results"; those of the table `ledger` are the columns ID, Statement, Source and Class
# of the ledger of note 27 (docs/27-hypothesis-ledger.md, section 2), word for word: a test compares them.
#
# The tasks of a claim are the tasks of the registry groups named in `groups` and the tasks whose ids
# match a pattern of `tasks` (`*` stands for any run of characters).  A claim without tasks says why in
# `no_task`: a statement read in a source [P], recalled [M], derived on paper [D] or heuristic [H] has no
# task, and no computation is attached to it.  `covers` says which part of a claim its tasks bear on.
# `evidence` names the stored lines that carry the claim's numbers: a file of the data archive (DATA.md),
# a line or a range of lines, and a text that the first of those lines contains.
# `records` names the claim under whose heading claims/RECORDS.md lists the tasks, when it is another.
# Negative controls (ids ending in "!control") and synthetic tasks never count for a claim.

[table.main]
heading = '''Main results'''
columns = ['''Result''', '''Numbers''', '''Where''', '''Evidence''']

[table.other]
heading = '''Computations outside the main results'''
columns = ['''Computations''', '''Where''', '''Evidence''']

[table.ledger]
heading = '''The hypothesis ledger of note 27'''
columns = ['''ID''', '''Statement''', '''Source''', '''Class''']

